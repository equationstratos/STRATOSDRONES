<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>
STRATOS DRONES - TinyHoop MK1 Builder
</title>


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<link rel="stylesheet" href="css/build.css">


<style>

html,body{

    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;

}


#droneCanvas{

    position:absolute;
    width:100%;
    height:100%;
    display:block;

}


#app{

    width:100%;
    height:100%;
}



</style>


</head>





<body>


<div id="app">



<!-- =================================================
                THREE CANVAS
================================================= -->


<canvas id="droneCanvas"></canvas>






<!-- =================================================
                TOP BAR
================================================= -->


<header id="topbar">


<div class="logo">

STRATOS DRONES

<br>

<span>
TinyHoop MK1 BUILDER
</span>

</div>




<div class="actions">


<button id="buildButton">

BUILD

</button>


<button id="resetButton">

RESET

</button>


<button id="testButton">

TEST DRONE

</button>


</div>



</header>








<!-- =================================================
                INVENTORY
================================================= -->


<section id="inventory">


<h2>
PARTS
</h2>



<div class="category">

<h3>
FRAME
</h3>


<div class="part">
Carbon Frame
</div>


</div>






<div class="category">

<h3>
ELECTRONICS
</h3>


<div class="part">
Flight Controller
</div>


<div class="part">
ESC
</div>


<div class="part">
VTX
</div>


<div class="part">
ELRS RX
</div>


<div class="part">
GPS
</div>


</div>






<div class="category">


<h3>
HARDWARE
</h3>


<div class="part">
Motors
</div>


<div class="part">
Battery
</div>


</div>



</section>









<!-- =================================================
                 STATUS
================================================= -->


<section id="status">


<div id="stepTitle">

STARTING

</div>



<div id="stepDescription">

Loading simulator...

</div>




<div id="progressBar">


<div id="progress">

</div>


</div>



</section>









<!-- =================================================
              SOLDER WINDOW
================================================= -->


<section id="solderMode" style="display:none;">


<div class="solderHeader">


SOLDER MODE


<button id="exitSolder">

EXIT

</button>


</div>



<div id="solderBoard">

</div>



<div id="connectionInfo">

Connect electronic pads

</div>



</section>









<!-- =================================================
                TEST WINDOW
================================================= -->


<section id="testPanel" style="display:none;">


<h2>

DRONE TEST

</h2>


<div id="testLog">

Waiting...

</div>


<button id="closeTest">

CLOSE

</button>


</section>








<!-- SMOKE EFFECT -->


<div id="smoke" style="display:none;">

</div>





</div>









<!-- =================================================
                THREE JS
================================================= -->


<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/loaders/GLTFLoader.js"></script>







<!-- =================================================
             STRATOS ENGINE
================================================= -->


<script src="js/config.js"></script>


<script src="js/scene.js"></script>


<script src="js/workshop.js"></script>


<script src="js/partsManager.js"></script>


<script src="js/snapSystem.js"></script>


<script src="js/buildManager.js"></script>


<script src="js/wiring.js"></script>


<script src="js/solderMode.js"></script>


<script src="js/testBench.js"></script>


<script src="js/audio.js"></script>


<script src="js/ui.js"></script>


<script src="js/main.js"></script>





</body>


</html>
